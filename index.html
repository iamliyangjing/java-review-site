<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>Java 面试题库 · 桌面应用</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f7f5; color: #18352d; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(640px, calc(100% - 48px)); padding: 40px; border: 1px solid #dce7e1; border-radius: 24px; background: white; box-shadow: 0 24px 70px #173c2d12; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { color: #5b6c65; line-height: 1.8; }
    .badge { display: inline-flex; padding: 6px 11px; border-radius: 99px; background: #e8f6ed; color: #237247; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Windows 桌面应用 · 离线可用</span>
    <h1>Java 面试题库</h1>
    <p>本项目已转为 Windows 桌面复习应用。请从 GitHub Releases 下载安装版或便携版；浏览器页面不再包含题库运行环境。</p>
    <p>应用数据默认保存在本机。请阅读仓库 README 获取安装、备份和授权说明。</p>
  </main>
</body>
</html>
